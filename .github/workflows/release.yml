name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: ubuntu-22.04 # oldest supported runner, so the binary works on older glibc
            target: x86_64-unknown-linux-gnu
            test: true
          - os: macos-14 # Apple Silicon runner building for Intel; can't run the x86_64 tests
            target: x86_64-apple-darwin
            test: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      # Unit tests only; the ffmpeg end-to-end tests are #[ignore]d.
      - name: Test
        if: matrix.test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="scenesplit-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          bin="target/${{ matrix.target }}/release/scenesplit"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "../$bin.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "archive=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            # tar keeps the executable bit, which upload-artifact's zip would drop.
            cp "../$bin" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: scenesplit-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
