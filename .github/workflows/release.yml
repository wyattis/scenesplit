name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Static GPL builds of ffmpeg bundled into each archive (see THIRD-PARTY-NOTICES.md).
  BTBN_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
  BTBN_BUILD: n9.0-latest
  BTBN_SUFFIX: gpl-9.0
  EVERMEET_VERSION: 9.0.2

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: ubuntu-22.04 # oldest supported runner, so the binary works on older glibc
            target: x86_64-unknown-linux-gnu
            test: true
          - os: macos-14 # Apple Silicon runner building for Intel; can't run the x86_64 binaries
            target: x86_64-apple-darwin
            test: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Fetch ffmpeg
        run: |
          mkdir -p ffmpeg-dl ffmpeg-bundle
          case "$RUNNER_OS" in
            Windows)
              curl -fsSL -o ffmpeg-dl/ffmpeg.zip "$BTBN_URL/ffmpeg-$BTBN_BUILD-win64-$BTBN_SUFFIX.zip"
              7z x -offmpeg-dl ffmpeg-dl/ffmpeg.zip > /dev/null
              cp ffmpeg-dl/*/bin/ffmpeg.exe ffmpeg-dl/*/bin/ffprobe.exe ffmpeg-bundle/
              ;;
            Linux)
              curl -fsSL "$BTBN_URL/ffmpeg-$BTBN_BUILD-linux64-$BTBN_SUFFIX.tar.xz" | tar xJ -C ffmpeg-dl
              cp ffmpeg-dl/*/bin/ffmpeg ffmpeg-dl/*/bin/ffprobe ffmpeg-bundle/
              ;;
            macOS)
              for tool in ffmpeg ffprobe; do
                curl -fsSL -o "ffmpeg-dl/$tool.zip" "https://evermeet.cx/ffmpeg/$tool-$EVERMEET_VERSION.zip"
                unzip -oq "ffmpeg-dl/$tool.zip" -d ffmpeg-bundle
              done
              ;;
          esac
          chmod +x ffmpeg-bundle/*
          ls -l ffmpeg-bundle
          # Make it available to the tests.
          if [[ "$RUNNER_OS" == Windows ]]; then cygpath -w "$PWD/ffmpeg-bundle"; else echo "$PWD/ffmpeg-bundle"; fi >> "$GITHUB_PATH"

      # Includes the #[ignore]d tests that need ffmpeg, now that it's on PATH.
      - name: Test
        if: matrix.test
        run: cargo test --release --target ${{ matrix.target }} -- --include-ignored

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Two archives: one with ffmpeg next to the app, and the app alone for people who
      # already have ffmpeg on PATH.
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          bin="target/${{ matrix.target }}/release/scenesplit"
          [[ "${{ runner.os }}" == "Windows" ]] && bin="$bin.exe"
          for variant in with-ffmpeg no-ffmpeg; do
            name="scenesplit-$version-${{ matrix.target }}-$variant"
            mkdir -p "dist/$name"
            cp README.md "$bin" "dist/$name/"
            if [[ "$variant" == with-ffmpeg ]]; then
              cp THIRD-PARTY-NOTICES.md licenses/ffmpeg-GPL-3.0.txt "dist/$name/"
              # Next to the executable, where the app looks before PATH.
              cp ffmpeg-bundle/* "dist/$name/"
              if [[ "${{ matrix.test }}" == true ]]; then
                "dist/$name/ffmpeg" -version | head -1
              fi
            fi
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              (cd dist && 7z a "$name.zip" "$name" > /dev/null)
            else
              # tar keeps the executable bit, which upload-artifact's zip would drop.
              tar czf "dist/$name.tar.gz" -C dist "$name"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: scenesplit-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
